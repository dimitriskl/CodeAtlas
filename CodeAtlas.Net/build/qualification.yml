# Prepared under CodeAtlas.Net. Activation outside this directory and hosted runs
# require the user's explicit directory/machine approval.
name: Package qualification
on:
  workflow_dispatch:
  push:
    branches: [codex/production-roadmap]
    tags: ['v*']
    # GitHub does not evaluate paths for tag pushes, so every v* tag starts a run.
    paths:
      - 'CodeAtlas.Net/**'
      - '.github/workflows/qualification.yml'
  pull_request:
    paths:
      - 'CodeAtlas.Net/**'
      - '.github/workflows/qualification.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest runs only for v* tags and manual runs, which give a release its macOS evidence.
        # Every list keeps windows-2025: the install job downloads the package built there.
        os: &qualification-os ${{ fromJSON(format('["windows-2025","ubuntu-24.04"{0}]', (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && ',"macos-latest"' || '')) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: CodeAtlas.Net
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: CodeAtlas.Net/global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      # macOS temp (/var/folders) sits behind the /var -> /private/var symlink, and symlink
      # aliases are outside the qualified path model, so tests use the runner's real temp folder.
      - name: Use a temp folder without symlink aliases on macOS
        if: runner.os == 'macOS'
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # The CRAP gate runs on Ubuntu only: one OS gives one set of scores for build/crap-exceptions.json,
      # and coverage stays off Windows, where the test step took 12.8 to 18.8 of its 30 minutes without it.
      - name: Locked restore, tests, package inspection
        run: python scripts/qualify-package.py --output .codeatlas/qualification --skip-smoke ${{ runner.os == 'Linux' && '--crap-gate' || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: build-evidence-${{ matrix.os }}
          path: |
            CodeAtlas.Net/.codeatlas/qualification/*.txt
            CodeAtlas.Net/.codeatlas/qualification/*.json
            CodeAtlas.Net/.codeatlas/qualification/test-results/*.trx
            CodeAtlas.Net/.codeatlas/qualification/test-results/*/Sequence_*.xml
            CodeAtlas.Net/.codeatlas/qualification/test-results/*/*.dmp
            CodeAtlas.Net/.codeatlas/qualification/test-results/*/*.cobertura.xml
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-inputs-${{ matrix.os }}
          path: CodeAtlas.Net/.codeatlas/qualification/qualification-inputs
          retention-days: 14
  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # The build job's list, so every host that builds also installs.
        os: *qualification-os
    runs-on: ${{ matrix.os }}
    # Intentionally no checkout: every host consumes the SAME Windows-built package.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualification-inputs-windows-2025
          path: qualification-inputs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read package SDK
        id: sdk
        shell: python
        run: |
          import json, os
          value = json.load(open('qualification-inputs/metadata.json'))['sdkVersion']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={value}\n')
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}
      - name: Install and index with isolated tool/package cache
        shell: python
        run: |
          import json, pathlib, subprocess, sys
          folder = pathlib.Path('qualification-inputs').resolve()
          metadata = json.loads((folder / 'metadata.json').read_text())
          subprocess.run([sys.executable, str(folder / 'package-smoke.py'),
              '--package', str(folder / metadata['package']),
              '--fixture', str(folder / metadata['fixture']),
              '--version', metadata['productVersion'],
              '--scratch', str(pathlib.Path('installed-tool-smoke').resolve())], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: install-evidence-${{ matrix.os }}
          path: |
            installed-tool-smoke/*.txt
            installed-tool-smoke/*.json
          retention-days: 14
